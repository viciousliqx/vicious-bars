description=A full visual overhaul for HP, Prayer, Special Attack, and Run Energy, each independently configurable: pick the orientation, length, width, frame style, and fill colors, with a threshold glow that lights up the bar when a stat crosses a limit you set. Regen/drain rings show poison and disease countdowns, prayer point regeneration, and special attack recharge. Drag bars into place in an edit mode with an optional alignment grid, and hide the real orb's own depletion effect since the bar already shows it. When the main bars are hidden, matching non-interactive overlay bars take over automatically, plus two extras with no main-bar equivalent: a Wintertodt warmth bar and a current-target enemy HP bar - dock any of them to the inventory panel or float them freely. Three optional hotkeys, unbound by default, toggle the main bars, edit mode, and the aux bars independently.
tags=hp,prayer,vitals,bars,orbs,health,special attack,run energy,warmth,wintertodt,overlay
